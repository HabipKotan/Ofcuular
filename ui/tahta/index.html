<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ders Defteri</title>
<style>
  :root {
    --zemin: #f1efe9; --kagit: #fffdf8; --kagit-cizgi: #d9dfe8; --murekkep: #1b1b1a;
    --panel: #ffffff; --panel-kenar: #dcd9d1; --yazi: #1b1b1a; --yazi-soluk: #6b6962;
    --vurgu: #2a5fd0; --vurgu-zemin: #e4ecfb; --dugme: #f4f2ed; --tehlike: #c0392b;
    --golge: 0 6px 24px rgba(0,0,0,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --zemin: #111110; --kagit: #1d1d1b; --kagit-cizgi: #33363c; --murekkep: #f2f1ec;
      --panel: #262624; --panel-kenar: #3a3a37; --yazi: #f2f1ec; --yazi-soluk: #a3a199;
      --vurgu: #7ea6f5; --vurgu-zemin: #2b3a57; --dugme: #32322f; --tehlike: #ef7a6d;
      --golge: 0 6px 24px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --zemin: #111110; --kagit: #1d1d1b; --kagit-cizgi: #33363c; --murekkep: #f2f1ec;
    --panel: #262624; --panel-kenar: #3a3a37; --yazi: #f2f1ec; --yazi-soluk: #a3a199;
    --vurgu: #7ea6f5; --vurgu-zemin: #2b3a57; --dugme: #32322f; --tehlike: #ef7a6d;
    --golge: 0 6px 24px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--zemin); color: var(--yazi); overflow: hidden;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg.ikon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8;
             stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---- ust cubuk ---- */
  header {
    flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    background: var(--panel); border-bottom: 1px solid var(--panel-kenar); z-index: 5;
  }
  #ders { flex: 1; min-width: 0; font: inherit; font-weight: 600; font-size: 16px; color: var(--yazi);
          background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px;
          -webkit-user-select: text; user-select: text; }
  #ders:hover, #ders:focus { border-color: var(--panel-kenar); outline: none; background: var(--dugme); }
  #durum { color: var(--yazi-soluk); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .kare { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px;
          border: 1px solid transparent; background: transparent; }
  .kare:hover { background: var(--dugme); }
  .kare:disabled { opacity: .35; cursor: default; background: transparent; }
  header.sure-bitti { animation: yanip 0.5s 6 alternate; }
  @keyframes yanip { to { background: var(--vurgu-zemin); } }

  .birincil { height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--vurgu);
              background: var(--vurgu); color: var(--panel); font-weight: 600; white-space: nowrap; }
  .birincil.calisiyor { background: transparent; color: var(--tehlike); border-color: var(--tehlike); }
  #ders-sure { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

  body.kilitli #canli { cursor: not-allowed !important; }
  #kilit { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); z-index: 2; pointer-events: none;
           background: var(--panel); color: var(--yazi); border: 1px solid var(--panel-kenar); border-radius: 12px;
           box-shadow: var(--golge); padding: 12px 18px; font-size: 15px; text-align: center; max-width: calc(100% - 32px); }
  body:not(.kilitli) #kilit { display: none; }
  .birincil.dikkat { animation: salla .35s 2; }
  @keyframes salla { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  #geri-don { height: 38px; padding: 0 12px 0 6px; border-radius: 10px; border: 1px solid var(--panel-kenar);
              background: var(--dugme); display: flex; align-items: center; gap: 2px; font-weight: 600; white-space: nowrap; }
  #geri-don[hidden] { display: none; }
  #onizleme { position: absolute; z-index: 3; pointer-events: none; background: var(--panel); border: 1px solid var(--panel-kenar);
              border-radius: 12px; box-shadow: var(--golge); padding: 8px; }
  #onizleme[hidden] { display: none; }
  #onizleme canvas { display: block; width: 240px; height: 170px; border-radius: 6px; border: 1px solid var(--panel-kenar); }
  #onizleme div { font-size: 12.5px; margin-top: 6px; color: var(--yazi-soluk); max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #onizleme b { color: var(--yazi); }
  body.defter-ustu #canli { cursor: pointer !important; }

  /* ---- ogretici ---- */
  #ogretici { position: fixed; inset: 0; z-index: 50; }
  #isik { position: absolute; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0,0,0,.58), 0 0 0 2px var(--vurgu);
          transition: all .2s ease; pointer-events: none; }
  #kart { position: absolute; width: min(330px, calc(100vw - 24px)); background: var(--panel); color: var(--yazi);
          border: 1px solid var(--panel-kenar); border-radius: 14px; box-shadow: var(--golge); padding: 14px;
          transition: left .2s ease, top .2s ease; }
  #kart .sira { font-size: 12px; color: var(--yazi-soluk); font-variant-numeric: tabular-nums; }
  #kart h3 { margin: 2px 0 6px; font-size: 16px; }
  #kart p { margin: 0 0 12px; font-size: 14px; line-height: 1.45; }
  #kart .dugmeler { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  #kart .dugmeler .bosluk { flex: 1; }
  #kart button { height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid transparent; background: var(--dugme); font-size: 13px; }
  #kart button.birincil { background: var(--vurgu); color: var(--panel); border-color: var(--vurgu); }
  #kart button.metin-dugme { background: transparent; color: var(--yazi-soluk); padding: 0 6px; text-decoration: underline; }
  #kart button:disabled { opacity: .4; cursor: default; }

  /* ---- defter ---- */
  main { flex: 1; position: relative; min-height: 0; }
  #kaydir { position: absolute; inset: 0; overflow-y: scroll; overflow-x: hidden; overscroll-behavior: contain; }
  #sahne { position: sticky; top: 0; height: 0; z-index: 1; }
  #sahne canvas { position: absolute; left: 0; top: 0; display: block; touch-action: none; }
  #taban { background: var(--kagit); }
  #uzunluk { position: relative; width: 100%; pointer-events: none; }
  #uzunluk textarea {
    position: absolute; pointer-events: auto; z-index: 3; min-width: 120px; min-height: 1.4em; resize: none;
    background: var(--kagit); border: 1.5px dashed var(--vurgu); border-radius: 4px; padding: 2px 4px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.3; outline: none;
    overflow: hidden; -webkit-user-select: text; user-select: text;
  }
  body[data-arac="kalem"] #canli, body[data-arac="fosfor"] #canli,
  body[data-arac="cizgi"] #canli, body[data-arac="ok"] #canli,
  body[data-arac="kutu"] #canli, body[data-arac="elips"] #canli { cursor: crosshair; }
  body[data-arac="silgi"] #canli, body[data-arac="nokta"] #canli { cursor: cell; }
  body[data-arac="metin"] #canli { cursor: text; }
  body[data-arac="saat"] #canli, body[data-arac="defter"] #canli { cursor: copy; }

  /* ---- yan panel ---- */
  #panel {
    position: absolute; top: 10px; right: 10px; bottom: 10px; width: 248px; max-width: calc(100% - 60px);
    background: var(--panel); border: 1px solid var(--panel-kenar); border-radius: 14px; box-shadow: var(--golge);
    z-index: 4; display: flex; flex-direction: column; transition: transform .22s ease;
  }
  body.panel-kapali #panel { transform: translateX(calc(100% + 10px)); box-shadow: none; }
  #kulak {
    position: absolute; left: -31px; top: 50%; transform: translateY(-50%); width: 31px; height: 72px;
    background: var(--panel); border: 1px solid var(--panel-kenar); border-right: none;
    border-radius: 12px 0 0 12px; display: grid; place-items: center; padding: 0;
    box-shadow: -4px 2px 10px rgba(0,0,0,.08);
  }
  #kulak svg { transition: transform .22s; }
  body.panel-kapali #kulak svg { transform: rotate(180deg); }
  #panel-ic { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
  #panel h2 { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .04em;
              text-transform: uppercase; color: var(--yazi-soluk); }
  .izgara { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .arac { line-height: 1.1; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
          border-radius: 10px; border: 1px solid transparent; background: var(--dugme); font-size: 10.5px; padding: 0; }
  .arac[aria-pressed="true"] { background: var(--vurgu-zemin); border-color: var(--vurgu); color: var(--vurgu); }
  .renkler { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .renk { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--panel); padding: 0;
          box-shadow: 0 0 0 1px var(--panel-kenar); }
  .renk[aria-pressed="true"] { box-shadow: 0 0 0 2.5px var(--vurgu); }
  #kagit-renkler .renk { border-radius: 8px; }
  .renk.oto { background: linear-gradient(135deg, #fffdf8 50%, #1d1d1b 50%); }
  .ozel-sar { display: block; overflow: hidden; cursor: pointer;
              background: conic-gradient(#e34948, #eda100, #1baf7a, #2a78d6, #7a4fd0, #e34948); }
  .ozel-sar input { width: 100%; height: 100%; opacity: 0; padding: 0; border: none; cursor: pointer; }
  .satir { display: flex; align-items: center; gap: 10px; }
  input[type=range] { flex: 1; accent-color: var(--vurgu); min-width: 0; }
  #kalinlik-deger { width: 30px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
  #onizle { width: 44px; height: 30px; display: grid; place-items: center; flex: none; }
  #onizle i { display: block; border-radius: 99px; background: var(--murekkep); }
  .secenek { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .secenek button, .duz { height: 36px; border-radius: 9px; border: 1px solid transparent;
                          background: var(--dugme); font-size: 12.5px; padding: 0 8px; }
  .secenek button[aria-pressed="true"] { background: var(--vurgu-zemin); border-color: var(--vurgu); color: var(--vurgu); }
  .duz { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; }
  .duz.tehlike { color: var(--tehlike); }
  .ikili { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  label.anahtar { display: flex; align-items: center; gap: 8px; font-size: 13.5px; cursor: pointer; }
  label.anahtar input { width: 18px; height: 18px; accent-color: var(--vurgu); }
  #sayac { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: center; margin: 2px 0 6px; }
  .not { font-size: 12px; color: var(--yazi-soluk); margin: 6px 0 0; }
</style>
</head>
<body data-arac="kalem">

<header id="ust">
  <button id="geri-don" hidden title="Bir önceki deftere dön"><svg class="ikon" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span>Ana defter</span></button>
  <input id="ders" placeholder="Ders adı (örn. Matematik 9-A)" aria-label="Ders adı" autocomplete="off">
  <span id="ders-sure" hidden title="Ders süresi">00:00</span>
  <button class="birincil" id="ders-dugme">Dersi başlat</button>
  <span id="durum" aria-live="polite"></span>
  <button class="kare" id="geri" title="Geri al (Ctrl+Z)" aria-label="Geri al"><svg class="ikon" viewBox="0 0 24 24"><path d="M9 5L4 10l5 5M4 10h10a5 5 0 010 10h-4"/></svg></button>
  <button class="kare" id="ileri" title="Yinele (Ctrl+Y)" aria-label="Yinele"><svg class="ikon" viewBox="0 0 24 24"><path d="M15 5l5 5-5 5M20 10H10a5 5 0 000 10h4"/></svg></button>
</header>

<main>
  <div id="kaydir">
    <div id="sahne"><canvas id="taban"></canvas><canvas id="canli"></canvas></div>
    <div id="uzunluk"></div>
  </div>

  <div id="onizleme" hidden><canvas></canvas><div></div></div>
  <div id="kilit">Yazmak ve çizmek için önce <b>Dersi başlat</b>'a basın.</div>

  <aside id="panel" aria-label="Araçlar">
    <button id="kulak" title="Araç panelini aç/kapat" aria-label="Araç panelini aç/kapat" aria-expanded="true"><svg class="ikon" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <div id="panel-ic">
      <section>
        <h2>Araçlar</h2>
        <div class="izgara" id="araclar">
          <button class="arac" data-arac="kalem" title="Kalem (K)"><svg class="ikon" viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16l-1 4z"/></svg>Kalem</button>
          <button class="arac" data-arac="fosfor" title="Fosforlu kalem (F)"><svg class="ikon" viewBox="0 0 24 24"><path d="M8 14l8-9 4 4-9 8H8v-3zM8 17l-3 3h5"/></svg>Fosfor</button>
          <button class="arac" data-arac="nokta" title="Silgi: yalnızca üzerinden geçtiğiniz yeri siler (S)"><svg class="ikon" viewBox="0 0 24 24"><path d="M4 15l9-9 6 6-7 7H8l-4-4zM12 19h8"/></svg>Silgi</button>
          <button class="arac" data-arac="silgi" title="Çizgi sil: dokunduğu çizgiyi bütün olarak siler (D)"><svg class="ikon" viewBox="0 0 24 24"><path d="M4 15l9-9 6 6-7 7H8l-4-4z"/><path d="M15 17l5 5M20 17l-5 5"/></svg>Çizgi sil</button>
          <button class="arac" data-arac="metin" title="Metin (T)"><svg class="ikon" viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M9 19h6"/></svg>Metin</button>
          <button class="arac" data-arac="cizgi" title="Düz çizgi"><svg class="ikon" viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg>Çizgi</button>
          <button class="arac" data-arac="ok" title="Ok"><svg class="ikon" viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg>Ok</button>
          <button class="arac" data-arac="kutu" title="Dikdörtgen"><svg class="ikon" viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/></svg>Kutu</button>
          <button class="arac" data-arac="elips" title="Elips"><svg class="ikon" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg>Elips</button>
          <button class="arac" data-arac="saat" title="Dokunduğunuz yere şu anki saati yazar"><svg class="ikon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Saat</button>
          <button class="arac" data-arac="defter" title="Not defteri: dokunduğunuz yere ayrı bir not defteri koyar ve açar"><svg class="ikon" viewBox="0 0 24 24"><path d="M7 4h11a1 1 0 011 1v14a1 1 0 01-1 1H7zM7 4v16M4 8h3M4 12h3M4 16h3M11 9h5M11 13h5"/></svg>Not defteri</button>
        </div>
      </section>

      <section>
        <h2>Renk</h2>
        <div class="renkler" id="renkler"></div>
      </section>

      <section>
        <h2>Kalınlık</h2>
        <div class="satir"><input id="kalinlik" type="range" min="1" max="100" step="1" aria-label="Kalınlık (1-100)"><output id="kalinlik-deger" for="kalinlik">1</output><span id="onizle"><i></i></span></div>
      </section>

      <section>
        <h2>Kâğıt</h2>
        <div class="secenek" id="kagitlar">
          <button data-kagit="duz">Düz</button><button data-kagit="cizgili">Çizgili</button>
          <button data-kagit="kareli">Kareli</button><button data-kagit="noktali">Noktalı</button>
        </div>
        <div class="renkler" id="kagit-renkler" style="margin-top:10px" aria-label="Arka plan rengi"></div>
      </section>

      <section>
        <h2>Giriş</h2>
        <label class="anahtar"><input type="checkbox" id="parmak"> Parmakla çiz</label>
        <p class="not">Kapalıyken parmak sayfayı kaydırır, kalem çizer.</p>
      </section>

      <section>
        <h2>Geri sayım</h2>
        <div id="sayac">05:00</div>
        <div class="secenek" style="margin-bottom:6px">
          <button data-dk="1">1 dk</button><button data-dk="3">3 dk</button>
          <button data-dk="5">5 dk</button><button data-dk="10">10 dk</button>
        </div>
        <div class="ikili"><button class="duz" id="sayac-baslat">Başlat</button><button class="duz" id="sayac-sifirla">Sıfırla</button></div>
      </section>

      <section>
        <h2>Defter</h2>
        <div class="ikili" style="margin-bottom:6px">
          <button class="duz" id="png">PNG indir</button><button class="duz" id="json">JSON indir</button>
        </div>
        <button class="duz" id="yukle" style="margin-bottom:6px">JSON'dan aç</button>
        <button class="duz" id="ogretici-ac" style="margin-bottom:6px">Öğreticiyi göster</button>
        <button class="duz tehlike" id="temizle">Tümünü temizle</button>
        <input type="file" id="dosya" accept="application/json,.json" hidden>
        <p class="not">Notlar bu tarayıcıda otomatik saklanır. Her çizginin yazıldığı saat JSON'a kaydedilir.</p>
      </section>
    </div>
  </aside>
</main>

<div id="ogretici" hidden>
  <div id="isik"></div>
  <div id="kart" role="dialog" aria-modal="true" aria-labelledby="kart-baslik">
    <div class="sira" id="kart-sira"></div>
    <h3 id="kart-baslik"></h3>
    <p id="kart-metin"></p>
    <div class="dugmeler">
      <button id="og-geri">Geri</button>
      <button id="og-ileri" class="birincil">İleri</button>
      <span class="bosluk"></span>
      <button id="og-atla" class="metin-dugme">Hepsini atla</button>
      <button id="og-asla" class="metin-dugme">Bir daha gösterme</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const kaydir = $('#kaydir'), sahne = $('#sahne'), uzunluk = $('#uzunluk');
const taban = $('#taban'), canli = $('#canli');
const tctx = taban.getContext('2d'), cctx = canli.getContext('2d');
const ANAHTAR = 'ders-defteri-v1';
const YAZI_TIPI = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
const RENKLER = [
  ['murekkep', 'Mürekkep'], ['#d03b3b', 'Kırmızı'], ['#2a78d6', 'Mavi'], ['#1a8f3c', 'Yeşil'],
  ['#eb6834', 'Turuncu'], ['#7a4fd0', 'Mor'], ['#ffd400', 'Sarı'],
];

/* ------------------------------------------------------------------ durum */
let ogeler = [];            // defterdeki her sey (vektor); sirasi cizim sirasidir
let geriYigin = [], ileriYigin = [];
let kagit = 'cizgili', kagitRenk = 'varsayilan', arac = 'kalem', parmakCiz = false;
let dersBas = null, dersBit = null, dersAd = '';
let yigin = [];   // acik ic defterler: her kat { ogeler, geriYigin, ileriYigin, kaydirma, oge }   // ders sayaci (ms)
const SILGILER = ['silgi', 'nokta'];
const KAGIT_RENKLERI = [
  ['varsayilan', 'Varsayılan'], ['#ffffff', 'Beyaz'], ['#fdf3d7', 'Krem'], ['#fff7b0', 'Sarı'], ['#dff3dc', 'Yeşil'],
  ['#dcecfb', 'Mavi'], ['#fde3ec', 'Pembe'], ['#1f3b2d', 'Kara tahta'], ['#111111', 'Siyah'],
];
const ayar = {              // arac basina renk + kalinlik
  kalem: { renk: 'murekkep', w: 2.88 }, fosfor: { renk: '#ffd400', w: 18 }, silgi: { renk: null, w: 16 }, nokta: { renk: null, w: 14 },
  metin: { renk: 'murekkep', w: 4 }, cizgi: { renk: 'murekkep', w: 3 }, ok: { renk: 'murekkep', w: 3 },
  defter: { renk: null, w: 3 },
  kutu: { renk: 'murekkep', w: 3 }, elips: { renk: 'murekkep', w: 3 }, saat: { renk: '#2a78d6', w: 3 },
};
let gen = 0, yuk = 0, dpr = 1, belgeBoyu = 0;
const kutular = new WeakMap();   // oge -> [x1,y1,x2,y2]

const css = ad => getComputedStyle(document.documentElement).getPropertyValue(ad).trim();
const renkCoz = r => r === 'murekkep' ? css('--murekkep') : r;

/* ------------------------------------------------------------------ geometri */
function kutu(o) {
  let k = kutular.get(o);
  if (k) return k;
  if (o.k === 'yol') {
    let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
    for (let i = 0; i < o.n.length; i += 3) {
      x1 = Math.min(x1, o.n[i]); x2 = Math.max(x2, o.n[i]);

}
function ogYerlestir() {
  if ($('#ogretici').hidden) return;
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  for (const el of document.querySelectorAll(ADIMLAR[ogSira][0])) {
    const r = el.getBoundingClientRect(); if (!r.width && !r.height) continue;
    x1 = Math.min(x1, r.left); y1 = Math.min(y1, r.top); x2 = Math.max(x2, r.right); y2 = Math.max(y2, r.bottom);
  }
  const b = 6, isik = $('#isik'), kart = $('#kart'), vw = innerWidth, vh = innerHeight;
  x1 -= b; y1 -= b; x2 += b; y2 += b;
  isik.style.cssText = `left:${x1}px; top:${y1}px; width:${x2 - x1}px; height:${y2 - y1}px`;
  const kw = kart.offsetWidth, kh = kart.offsetHeight, ara = 14;
  let sol, ust;
  if (x1 - kw - ara >= 12 && x1 > vw / 2) { sol = x1 - kw - ara; ust = y1; }            // hedefin soluna
  else if (y2 + ara + kh <= vh - 12) { sol = x1; ust = y2 + ara; }                      // altina
  else if (y1 - ara - kh >= 12) { sol = x1; ust = y1 - ara - kh; }                      // ustune
  else { sol = (vw - kw) / 2; ust = vh - kh - 12; }
  kart.style.left = Math.max(12, Math.min(sol, vw - kw - 12)) + 'px';
  kart.style.top = Math.max(12, Math.min(ust, vh - kh - 12)) + 'px';
}

<!-- ============ Ders Asistani koprusu ============
     Bu sayfa arayuzun icinde (Streamlit bileseni olarak) acildiginda calisir; tek basina acilinca hicbir sey yapmaz.

     YONETILEN MOD (arayuz args.kimlik gonderir; ogretmen panelinde "Dersi Baslat" ile kullanilan):
       - Her yeni ders (yeni kimlik) BOS bir sayfayla acilir, ders adi yazilir, ders otomatik baslar (yazma kilidi acilir).
       - Defterin kendi "Dersi baslat/bitir" dugmesi gizlenir: ders arayuzden baslar/biter.
       - Tahta degistikce birkac saniyede bir arayuze {olay:"kaydet", kimlik, zaman, veri, png} gonderilir;
         arayuz bunu o dersin sayfasi olarak diske yazar (gosterilmez). args.bitiyor gelince hemen son kez kaydeder.
     ESKI MOD (kimlik yok): "Dersi baslat/bitir" -> {olay:"basladi"} / {olay:"bitti", veri, png}. -->
<script>
(() => {
  'use strict';
  if (window.parent === window) return;               // tek basina acildi: kopru kapali
  const gonder = (tip, ek) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: tip }, ek || {}), '*');
  const deger = v => gonder('streamlit:setComponentValue', { value: v, dataType: 'json' });
  const dugme = document.getElementById('ders-dugme');
  const KIMLIK_ANAHTARI = 'ders-asistani-tahta-kimlik';
  const ls = {
    al: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    yaz: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  let yukseklik = 760, kimlik = null, sonGonderilen = null, bekleyen = 0, sonKayit = 0;

  const suruyor = () => { const v = window.__defter.veri(); return !!(v.dersBaslangic && !v.dersBitis); };

  // ---- yonetilen mod: otomatik kayit ----
  function kaydetGonder() {
    const d = window.__defter; if (!d || !kimlik) return;
    clearTimeout(bekleyen); bekleyen = 0;
    const v = d.veri();
    const imza = JSON.stringify(v.ogeler);
    if (!v.ogeler.length || imza === sonGonderilen) return;   // bos sayfa ya da degisiklik yok
    let png = null;
    try { png = d.png(); } catch (e) { return; }
    sonGonderilen = imza; sonKayit = Date.now();
    deger({ olay: 'kaydet', kimlik, zaman: Date.now(), ders: v.ders || '', veri: v, png });
  }
  function birazSonraKaydet() {
    if (!kimlik) return;
    clearTimeout(bekleyen);
    // yazarken her 2,5 sn'lik duraklamada; surekli yaziliyorsa en gec 15 sn'de bir
    bekleyen = setTimeout(() => kaydetGonder(), Date.now() - sonKayit > 15000 ? 300 : 2500);
  }
  ['pointerup', 'keyup', 'touchend'].forEach(t => document.addEventListener(t, birazSonraKaydet, true));
  setInterval(() => kaydetGonder(), 10000);    // her ihtimale karsi (geri al / temizle vb.)

  function yonetilenDers(yeniKimlik, konu) {
    const d = window.__defter; if (!d) return;
    document.body.classList.add('yonetilen');
    if (ls.al(KIMLIK_ANAHTARI) !== yeniKimlik) {
      // YENI DERS: bos sayfa (onceki ders arayuz tarafinda zaten kaydedildi)
      ls.yaz(ANAHTAR_OGRETICI, 'kapali');               // ogretici ders basinda araya girmesin
      if (suruyor()) dugme.click();                     // onceki dersten acik kalan oturumu kapat
      d.yeniSayfa();
      const giris = document.getElementById('ders');
      giris.value = konu || '';
      giris.dispatchEvent(new Event('input', { bubbles: true }));
      ls.yaz(KIMLIK_ANAHTARI, yeniKimlik);
      sonGonderilen = null;
    } else {
      sonGonderilen = JSON.stringify(d.veri().ogeler);  // ayni ders (sayfa yenilendi): kaldigi yerden
    }
    if (!suruyor()) dugme.click();                      // yazma kilidini ac, ders sayacini baslat
    kimlik = yeniKimlik;
  }
  const ANAHTAR_OGRETICI = 'ders-defteri-v1-ogretici';

  window.addEventListener('message', e => {
    const m = e.data || {};
    if (m.type !== 'streamlit:render') return;
    const a = m.args || {};
    yukseklik = a.yukseklik || yukseklik;
    gonder('streamlit:setFrameHeight', { height: yukseklik });
    if (a.kimlik) {
      const k = String(a.kimlik);
      if (k !== kimlik) yonetilenDers(k, a.konu || '');
      if (a.bitiyor) kaydetGonder();                // ders bitiyor: son hali hemen gonder
    }
  });
  gonder('streamlit:componentReady', { apiVersion: 1 });
  gonder('streamlit:setFrameHeight', { height: yukseklik });
  window.addEventListener('pagehide', () => kaydetGonder());

  // ---- eski mod: defterin kendi dugmesi ----
  let dersSuruyordu = false;
  // capture: defterin kendi isleyicisinden ONCE calisir, tiklamadan onceki durumu kaydeder
  document.addEventListener('click', e => {
    if (e.target.closest && e.target.closest('#ders-dugme') && window.__defter) dersSuruyordu = suruyor();
  }, true);
  dugme.addEventListener('click', () => {
    if (kimlik || document.body.classList.contains('yonetilen')) return;   // yonetilen modda olay yok
    setTimeout(() => {                                  // once defterin kendi isleyicisi durumu guncellesin
      const d = window.__defter; if (!d) return;
      const v = d.veri();
      if (v.dersBaslangic && !v.dersBitis) {
        if (!dersSuruyordu && d.yeniSayfa) d.yeniSayfa();   // yeni ders = bos tahta
        deger({ olay: 'basladi', zaman: Date.now(), ders: v.ders || '' });
      } else if (v.dersBitis) {
        let png = null;
        try { png = d.png(); } catch (e) {}
        deger({ olay: 'bitti', zaman: Date.now(), ders: v.ders || '', veri: v, png });
      }
    }, 50);
  });
})();
</script>
<style>
  /* yonetilen mod: ders arayuzden baslar/biter, defterin kendi dugmesi gizli */
  body.yonetilen #ders-dugme { display: none !important; }
</style>
</body>
